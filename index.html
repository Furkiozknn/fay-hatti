<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fay Hattı — Fault Line</title>
<meta name="description" content="Shift rows and columns of an Anatolian map to bring rivers and caravan roads to every village. A small quake moves one row after each of your moves. Daily puzzle and endless mode.">
<meta name="theme-color" content="#1b2830" id="metaThemeColor">
<style>
:root{--bg:#1b2830;--bg2:#23343d;--ink:#f3ead8;--ink2:#c9bda4;--paper:#f3e7cc;--paper-ink:#2b2118;--terra:#a63f27;--gold:#f2b33d;--quake:#e0553a;--focus:#7cc4f0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 80% at 50% 0%,#2a3f49 0%,var(--bg) 60%)}
body.biome-kapadokya{background:radial-gradient(120% 80% at 50% 0%,#35262c 0%,#1f161a 60%);--bg:#1f161a;--bg2:#2a1e24;--ink:#f6ede2;--ink2:#cdbdae;--paper:#f5ebd8;--paper-ink:#2d1e16;--terra:#b54c30;--gold:#e8a436;--quake:#e45838}
/* Karadeniz region visual theme: mist-tinted deep greens, highland paper, tea plantation tones */
body.biome-karadeniz,body.theme-karadeniz{--bg:#12241d;--bg2:#193228;--ink:#edf7f0;--ink2:#b2cebf;--paper:#e6f2e2;--paper-ink:#1b2d20;--terra:#2c7444;--gold:#e2a83b;--quake:#db5035;--focus:#59cf9e;background:radial-gradient(120% 80% at 50% 0%,#1e3d31 0%,var(--bg) 60%)}
body.biome-karadeniz .panel,body.theme-karadeniz .panel{box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 2px #a8cfa0}
body.biome-karadeniz .panel h1,body.biome-karadeniz .panel h2,body.theme-karadeniz .panel h1,body.theme-karadeniz .panel h2{color:#1a4d29}
body.biome-karadeniz .panel h1 small,body.theme-karadeniz .panel h1 small{color:#3d6e4b}
body.biome-karadeniz .panel .sub,body.biome-karadeniz .note,body.theme-karadeniz .panel .sub,body.theme-karadeniz .note{color:#35573e}
body.biome-karadeniz .btn.alt,body.theme-karadeniz .btn.alt{background:#d0e6cb;box-shadow:inset 0 0 0 1px #78aa72}
body.biome-karadeniz .btn.alt:hover,body.theme-karadeniz .btn.alt:hover{background:#dcedd8}
body.biome-karadeniz .mini button,body.theme-karadeniz .mini button{border-color:#78aa72}
body.biome-karadeniz .share-card-wrap,body.theme-karadeniz .share-card-wrap{background:#d2e8cc}
body.biome-karadeniz .share-prev,body.theme-karadeniz .share-prev{background:#d2e8cc}
body.biome-karadeniz .share-prev:hover,body.theme-karadeniz .share-prev:hover{background:#c6dec0}
body.biome-karadeniz .tb,body.theme-karadeniz .tb{border-color:#2a4a3c}
body.biome-karadeniz .tb:hover,body.theme-karadeniz .tb:hover{background:#234234}
/* Ege Region Theme: olive oil greens, terracotta, whitewashed stone */
body.biome-ege,body.theme-ege{--bg:#1c261e;--bg2:#253328;--ink:#f4eee1;--ink2:#b8c7ae;--paper:#f5efe3;--paper-ink:#2a2016;--terra:#b85437;--gold:#f0b83a;--quake:#df5238;--focus:#46a2d8;background:radial-gradient(120% 80% at 50% 0%,#2c3d2e 0%,var(--bg) 60%)}
body.biome-ege .panel,body.theme-ege .panel{box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 2px #c9b482}
body.biome-ege .panel h1,body.biome-ege .panel h2,body.theme-ege .panel h1,body.theme-ege .panel h2{color:#5a2a18}
body.biome-ege .panel h1 small,body.theme-ege .panel h1 small{color:#7a5638}
body.biome-ege .panel .sub,body.biome-ege .note,body.theme-ege .panel .sub,body.theme-ege .note{color:#5b4a36}
body.biome-ege .btn,body.theme-ege .btn{background:var(--terra)}
body.biome-ege .btn:hover,body.theme-ege .btn:hover{background:#ca5c3d}
body.biome-ege .btn.alt,body.theme-ege .btn.alt{background:#e8dfc7;box-shadow:inset 0 0 0 1px #9c844f}
body.biome-ege .btn.alt:hover,body.theme-ege .btn.alt:hover{background:#ede5d0}
body.biome-ege .mini button,body.theme-ege .mini button{border-color:#9c844f}
body.biome-ege .share-card-wrap,body.theme-ege .share-card-wrap{background:#e6ddc5}
body.biome-ege .share-prev,body.theme-ege .share-prev{background:#e6ddc5}
body.biome-ege .share-prev:hover,body.theme-ege .share-prev:hover{background:#ded5bd}
body.biome-ege .tb,body.theme-ege .tb{border-color:#384f3c;background:var(--bg2)}
body.biome-ege .tb:hover,body.theme-ege .tb:hover{background:#2f4233}
body.biome-ege #bot,body.theme-ege #bot{background:#3a543e;color:#e8f4ea}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
body.high-contrast{--bg:#081014;--bg2:#101a20;--ink:#ffffff;--ink2:#f5eedd;--paper:#ffffff;--paper-ink:#111111;--terra:#8a200a;--gold:#ffb703;--quake:#ff2a05;--focus:#00e5ff;background:#081014}
body.high-contrast .tb{border:2px solid #7899ab;color:#ffffff}
body.high-contrast .panel{box-shadow:0 18px 50px rgba(0,0,0,.9),inset 0 0 0 3px #111111}
body.high-contrast .panel h1,body.high-contrast .panel h2{color:#111111}
body.high-contrast .btn{box-shadow:inset 0 0 0 2px #ffffff}
body.high-contrast .btn.alt{background:#f3f3f3;color:#111111;box-shadow:inset 0 0 0 2px #111111}
body.high-contrast .mini button{border:2px solid #111111;color:#111111;font-weight:700}
body.high-contrast .vfy-card{background:#ffffff;border:2px solid #111111;color:#111111}
body.high-contrast .vfy-stamp{background:#0f5132;color:#ffffff;box-shadow:inset 0 0 0 1px #ffffff}
body.high-contrast .share-card-wrap{border:2px solid #111111;box-shadow:none}
body.high-contrast .share-prev{border:2px solid #111111;background:#ffffff;color:#111111}
body.high-contrast .share-prev:hover{background:#f0f0f0}
body.high-contrast button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto;grid-template-areas:"hud" "quake" "stage" "bar";padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#hud{grid-area:hud;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 4px;max-width:620px;width:100%;margin:0 auto}
.brand{min-width:0}
.brand b{display:block;font:700 22px/1.1 "Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.02em}
.brand span{display:block;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;align-items:center;gap:14px}
.stat{text-align:center;min-width:44px}
.stat span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.stat b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:2px}
.stars svg{width:18px;height:18px}
#quake{grid-area:quake;display:flex;align-items:center;justify-content:center;gap:8px;min-height:30px;padding:2px 16px;font-size:15px;color:#ffd9cf}
#quake .dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--quake);box-shadow:0 0 0 0 rgba(224,85,58,.6);animation:pulse 1.4s infinite}
#quake.calm{color:var(--ink2)}#quake.calm .dot{background:#6f8f6a;animation:none}
#quake.quaking{color:#fff;background:rgba(224,85,58,.28);border-radius:8px}
#quake.quaking .dot{background:#ff7a59;box-shadow:0 0 10px #ff7a59}
#bot{display:none;margin-left:8px;padding:2px 8px;border-radius:999px;background:#33505c;color:#e7f4fb;font-size:13px;font-weight:700;letter-spacing:.05em}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(224,85,58,0)}100%{box-shadow:0 0 0 0 rgba(224,85,58,0)}}
#stage{grid-area:stage;position:relative;min-height:0;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bar{grid-area:bar;display:flex;justify-content:center;gap:8px;padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
.tb{min-width:58px;min-height:48px;padding:4px 8px;border:1px solid #3d5561;border-radius:12px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--ink)}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:#2c434e}.tb:disabled{opacity:.4;cursor:default}
.tb b{font-size:15px;line-height:22px}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(14,22,27,.74);z-index:10}
.ov.on{display:flex}
.panel{width:100%;max-width:380px;max-height:100%;overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:22px 20px;box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 2px #d9c596;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.panel h1{margin:0;font:700 34px/1.05 "Palatino Linotype",Palatino,Georgia,serif;color:#5a2a18}
.panel h1 small{display:block;font-size:17px;font-weight:400;color:#7a5638;margin-top:2px}
.panel h2{margin:0 0 6px;font:700 26px/1.1 "Palatino Linotype",Palatino,Georgia,serif;color:#5a2a18;text-align:center}
.panel .sub{margin:8px 0 14px;color:#5b4a36;font-size:15px}
.btn{display:block;width:100%;min-height:52px;margin:8px 0;padding:10px 14px;border:0;border-radius:12px;background:var(--terra);color:#fff8ec;font-size:17px;font-weight:700;text-align:left}
.btn small{display:block;font-weight:400;font-size:14px;opacity:.92}
.btn:hover{background:#b9472c}
.btn.alt{background:#e6d3a8;color:var(--paper-ink);box-shadow:inset 0 0 0 1px #b8935a}
.btn.alt:hover{background:#ecdcb6}
.row{display:flex;gap:8px}.row .btn{text-align:center}
.mini{display:flex;gap:8px;margin-top:10px}
.mini button{flex:1;min-height:44px;border-radius:10px;border:1px solid #b8935a;background:transparent;color:var(--paper-ink);font-size:15px}
.mini button:hover{background:#ecdcb6}
.big-stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.big-stars svg{width:46px;height:46px}
.big-stars svg.on{animation:starpop .45s cubic-bezier(.3,1.6,.5,1) both}
.big-stars svg:nth-child(2){animation-delay:.12s}.big-stars svg:nth-child(3){animation-delay:.24s}
@keyframes starpop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.res-line{text-align:center;font-size:17px;margin:2px 0 8px}
.share-card-wrap{width:100%;max-width:340px;margin:6px auto;border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.28);background:#eadebe;line-height:0}
.share-card-cv{width:100%;height:auto;display:block;aspect-ratio:560/420;cursor:pointer;transition:opacity .15s}
.share-card-cv:hover{opacity:.96}
.share-card-cv:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.share-prev{font:13px/1.3 ui-monospace,Consolas,monospace;background:#e9dab6;border-radius:10px;padding:8px 10px;text-align:center;margin:6px 0;white-space:pre-wrap;word-break:break-word;cursor:pointer;transition:background .15s}
.share-prev:hover{background:#dfd0ab}
.share-prev:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.note{text-align:center;font-size:14px;color:#5b4a36;margin:4px 0 0}
ol.help{padding-left:20px;margin:8px 0 12px}ol.help li{margin:6px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;margin-bottom:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0e171c;color:var(--ink);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
#debug{position:fixed;left:6px;top:6px;z-index:30;font:12px/1.3 ui-monospace,Consolas,monospace;background:rgba(0,0,0,.6);color:#9f9;padding:4px 6px;border-radius:6px;display:none;white-space:pre;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (orientation:landscape) and (max-height:540px){
  #app{grid-template-columns:minmax(170px,230px) 1fr auto;grid-template-rows:auto 1fr;grid-template-areas:"hud stage bar" "quake stage bar"}
  #hud{flex-direction:column;align-items:flex-start;padding:10px 6px 4px 12px}
  #quake{align-items:flex-start;justify-content:flex-start;padding:4px 6px 4px 12px;flex-wrap:wrap}
  #bar{flex-direction:column;padding:8px 10px 8px 4px;overflow:auto}
  .tb{min-height:44px;flex-direction:row;gap:6px}
}
.seal-wrap{display:flex;justify-content:center;margin:8px 0 6px}
.seal-svg{width:72px;height:72px;animation:sealpulse 2.4s ease-in-out infinite}
@keyframes sealpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.vfy-card{background:#e9dab6;border:1px solid #c9b485;border-radius:12px;padding:12px 14px;margin:8px 0 10px;font-size:14px;line-height:1.55;color:#433221}
.vfy-stamp{display:inline-block;margin-top:6px;padding:4px 10px;background:#325b39;color:#f3ead8;border-radius:6px;font:700 11px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}
/* Dynamic Tutorial Tooltip: phone-first Anatolian parchment card */
#tutTip{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:calc(100% - 24px);max-width:420px;background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:12px 14px;box-shadow:0 12px 36px rgba(0,0,0,.45),inset 0 0 0 2px #d9c596;display:none;flex-direction:column;gap:8px;z-index:6;pointer-events:auto;box-sizing:border-box;animation:tutPop .22s cubic-bezier(.2,1,.3,1)}
#tutTip.on{display:flex}
@keyframes tutPop{from{transform:translate(-50%,10px) scale(.95);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
.tut-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tut-title-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.tut-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:#e8d7b0;flex:none;color:#5a2a18}
.tut-title-wrap div{min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tut-badge{font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff8ec;background:var(--terra);padding:1px 7px;border-radius:999px;line-height:16px}
#tutTitle{font:700 16px/1.2 "Palatino Linotype",Palatino,Georgia,serif;color:#5a2a18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tut-close{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#7a5638;font-size:18px;line-height:1;border-radius:10px;padding:0;margin:-6px -6px -6px 0;cursor:pointer;flex:none}
.tut-close:hover{background:rgba(90,42,24,.08);color:#5a2a18}
.tut-close:focus-visible,.tut-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tut-body{margin:0;font-size:13.5px;line-height:1.35;color:#493826}
.tut-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.tut-dots{display:flex;gap:5px;align-items:center}
.tut-dot{width:7px;height:7px;border-radius:50%;background:#cbba95;transition:background .2s,transform .2s}
.tut-dot.on{background:var(--terra);transform:scale(1.35)}
.tut-actions{display:flex;align-items:center;gap:6px}
.tut-btn{min-height:44px;min-width:44px;padding:8px 16px;border:0;border-radius:10px;background:var(--terra);color:#fff8ec;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tut-btn:hover{background:#b9472c}
.tut-btn.alt{background:#e6d3a8;color:var(--paper-ink);box-shadow:inset 0 0 0 1px #b8935a}
.tut-btn.alt:hover{background:#ecdcb6}
body.high-contrast #tutTip{box-shadow:0 12px 36px rgba(0,0,0,.9),inset 0 0 0 3px #111111}
body.high-contrast #tutTitle,body.high-contrast .tut-body,body.high-contrast .tut-close{color:#111111}
body.high-contrast .tut-icon{background:#f0f0f0;color:#111111;border:1px solid #111111}
body.high-contrast .tut-dot{background:#888888}
body.high-contrast .tut-dot.on{background:var(--terra);box-shadow:0 0 0 1px #ffffff}
body.high-contrast .tut-btn{box-shadow:inset 0 0 0 2px #ffffff}
body.high-contrast .tut-btn.alt{background:#f3f3f3;color:#111111;box-shadow:inset 0 0 0 2px #111111}
body.high-contrast .tut-badge{box-shadow:inset 0 0 0 1px #ffffff}
@media (prefers-reduced-motion:reduce){#quake .dot{animation:none}.panel,.big-stars svg.on,.seal-svg,#tutTip{animation:none}.tut-dot{transition:none}#quake.quaking{transition:background .2s}}
/* Themes: Gece (night) and Kâğıt (paper-cut) */
:root[data-theme="gece"]{--bg:#0b111a;--bg2:#141f2e;--ink:#e5eef8;--ink2:#8ea4be;--paper:#162234;--paper-ink:#e8f0fa;--terra:#2a6ab0;--gold:#f5be47;--quake:#ff6247;--focus:#64b5f6}

html[data-theme="gece"] .panel{background:#162234;color:#e8f0fa;box-shadow:0 18px 50px rgba(0,0,0,.65),inset 0 0 0 2px #263852}
html[data-theme="gece"] .panel h1,html[data-theme="gece"] .panel h2{color:#7cb7ff}

html[data-theme="gece"] .tut-btn.alt{background:#23344d;color:#e8f0fa;box-shadow:inset 0 0 0 1px #3a547a}
html[data-theme="gece"] .tut-btn.alt:hover{background:#2c4160}

:root[data-theme="kagit"]{--bg:#2e2820;--bg2:#3c342b;--ink:#f8f2e4;--ink2:#c8bcab;--paper:#faf5e8;--paper-ink:#2e241c;--terra:#b5442b;--gold:#e09c30;--quake:#d94830;--focus:#60a5fa}

html[data-theme="kagit"] .share-card-wrap{background:#f0e8d6}

<script>
'use strict';
// ENGINE START
// Pure puzzle engine: no DOM. tools/sim.mjs extracts this block to test it in Node.
const N = 5, NN = 25;
// tile value = kind << 4 | low nibble (edge mask N=1 E=2 S=4 W=8 for paths, need bits for villages)
const KE = 0, KR = 1, KD = 2, KV = 3, KS = 4, KH = 5, KM = 6, KF = 7; // empty, river, road, village, spring, han, mountain, ferry (tile-ferry card)
const NEED_RIVER = 1, NEED_ROAD = 2;
const DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1], OPP = [2, 3, 0, 1];
const NB = new Int8Array(NN * 4);
for (let i = 0; i < NN; i++) {
  const r = (i / N) | 0, c = i % N;
  for (let e = 0; e < 4; e++) {
    const rr = r + DR[e], cc = c + DC[e];
    NB[i * 4 + e] = rr < 0 || rr >= N || cc < 0 || cc >= N ? -1 : rr * N + cc;
  }
}
const tv = (k, m) => (k << 4) | m;
const isFixedV = (v) => { const k = v >> 4; return k >= KV && k !== KF; };

function rng32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// Connector masks per tile value for each network type.
const RIV = new Uint8Array(256), ROD = new Uint8Array(256);
for (let v = 0; v < 256; v++) {
  const k = v >> 4;
  RIV[v] = k === KR ? v & 15 : k === KS ? 15 : k === KV && v & NEED_RIVER ? 15 : k === KF ? (v & 15 || 15) : 0;
  ROD[v] = k === KD ? v & 15 : k === KH ? 15 : k === KV && v & NEED_ROAD ? 15 : 0;
}

const STK = new Int8Array(32);
// Flood fill from src over tiles whose touching edges both carry type T. Returns a 25-bit cell mask.
function flood(vals, off, T, src) {
  if (src < 0) return 0;
  let seen = 1 << src, sp = 0;
  STK[sp++] = src;
  while (sp) {
    const i = STK[--sp], m = T[vals[off + i]];
    for (let e = 0; e < 4; e++) {
      if (!((m >> e) & 1)) continue;
      const j = NB[i * 4 + e];
      if (j < 0 || (seen >> j) & 1) continue;
      if ((T[vals[off + j]] >> OPP[e]) & 1) { seen |= 1 << j; STK[sp++] = j; }
    }
    // Ferry teleportation across water networks (tile-ferry card)
    if (T === RIV && (vals[off + i] >> 4) === KF) {
      for (let k = 0; k < NN; k++) {
        if (((vals[off + k] >> 4) === KF) && !((seen >> k) & 1)) { seen |= 1 << k; STK[sp++] = k; }
      }
    }
  }
  return seen;
}
// BFS distances (for the water-flow direction in the renderer).
function floodDist(vals, T, src) {
  const d = new Int8Array(NN).fill(-1);
  if (src < 0) return d;
  const q = [src]; d[src] = 0;
  for (let h = 0; h < q.length; h++) {
    const i = q[h], m = T[vals[i]];
    for (let e = 0; e < 4; e++) {
      if (!((m >> e) & 1)) continue;
      const j = NB[i * 4 + e];
      if (j < 0 || d[j] >= 0) continue;
      if ((T[vals[j]] >> OPP[e]) & 1) { d[j] = d[i] + 1; q.push(j); }
    }
    if (T === RIV && (vals[i] >> 4) === KF) {
      for (let k = 0; k < NN; k++) {
        if ((vals[k] >> 4) === KF && d[k] < 0) { d[k] = d[i] + 1; q.push(k); }
      }
    }
  }
  return d;
}

function boardStatus(pz, vals, off = 0) {
  const rr = flood(vals, off, RIV, pz.spring), rd = flood(vals, off, ROD, pz.han);
  const sat = [];
  for (const v of pz.villages) {
    const ok = (!(v.need & NEED_RIVER) || (rr >> v.cell) & 1) && (!(v.need & NEED_ROAD) || (rd >> v.cell) & 1);
    sat.push(!!ok);
  }
  return { rr, rd, sat, solved: sat.every(Boolean) };
}
function isSolved(pz, vals, off) {
  const rr = pz.needRiver ? flood(vals, off, RIV, pz.spring) : 0;
  const rd = pz.needRoad ? flood(vals, off, ROD, pz.han) : 0;
  for (const v of pz.villages) {
    if (v.need & NEED_RIVER && !((rr >> v.cell) & 1)) return false;
    if (v.need & NEED_ROAD && !((rd >> v.cell) & 1)) return false;
  }
  return true;
}

// Moves: code = line * 2 + dirBit. Lines 0-4 are rows, 5-9 columns. dirBit 0 = right/down, 1 = left/up.
// Fixed tiles (village, spring, han, mountain) never move: a shift cycles only the movable cells of the line.
const moveLine = (m) => m >> 1;
const moveDir = (m) => (m & 1 ? -1 : 1);
function lineCells(fixed, line) {
  const out = [];
  for (let j = 0; j < N; j++) {
    const i = line < N ? line * N + j : j * N + (line - N);
    if (!fixed[i]) out.push(i);
  }
  return out;
}
function buildPerms(fixed) {
  const perms = [], lens = [];
  for (let line = 0; line < 2 * N; line++) {
    const cells = lineCells(fixed, line), L = cells.length;
    lens[line] = L;
    for (let db = 0; db < 2; db++) {
      const p = new Uint8Array(NN);
      for (let i = 0; i < NN; i++) p[i] = i;
      if (L >= 2) for (let j = 0; j < L; j++) p[cells[(j + (db ? -1 : 1) + L) % L]] = cells[j];
      perms.push(p);
    }
  }
  return { perms, lens };
}
function permOff(src, so, dst, d0, p) { for (let i = 0; i < NN; i++) dst[d0 + i] = src[so + p[i]]; }
function applyPerm(src, p) { const o = new Uint8Array(NN); for (let i = 0; i < NN; i++) o[i] = src[p[i]]; return o; }
const toVals = (pz, ids) => { const o = new Uint8Array(NN); for (let i = 0; i < NN; i++) o[i] = pz.tiles[ids[i]]; return o; };

// Zobrist hashing (two 32-bit halves) over tile values, so identical-looking boards merge.
const ZA = new Int32Array(NN * 256), ZB = new Int32Array(NN * 256);
{ const r = rng32(0x5eed); for (let i = 0; i < ZA.length; i++) { ZA[i] = (r() * 4294967296) | 0; ZB[i] = (r() * 4294967296) | 0; } }
let HA = 0, HB = 0;
function hashOff(vals, off) {
  let a = 0, b = 0;
  for (let i = 0; i < NN; i++) { const o = i * 256 + vals[off + i]; a ^= ZA[o]; b ^= ZB[o]; }
  HA = a; HB = b;
}
const TT_BITS = 19, TT_MASK = (1 << TT_BITS) - 1;
const TTA = new Int32Array(1 << TT_BITS), TTB = new Int32Array(1 << TT_BITS), TTG = new Int32Array(1 << TT_BITS);
const TTD = new Int8Array(1 << TT_BITS);
let ttGen = 0;

// Strategy A: iterative-deepening DFS with a transposition table. Optimal (fewest player moves).
// State = board + quake phase (moves made mod quake-cycle length). After a move: solved -> stop, else the quake hits.
function solveOptimal(pz, vals0, k0, maxDepth, nodeCap = 6e6) {
  const P = pz.quakes.length, ml = pz.moveList, perms = pz.perms;
  if (isSolved(pz, vals0, 0)) return { path: [], nodes: 0 };
  const buf = new Uint8Array((maxDepth + 2) * NN * 2);
  buf.set(vals0, 0);
  const path = [];
  let nodes = 0, limit = 0, foundLen = -1;
  function dfs(g, k) {
    const base = g * 2 * NN, tmp = base + NN, nxt = base + 2 * NN;
    const qp = perms[pz.quakes[k % P]];
    for (let mi = 0; mi < ml.length; mi++) {
      const m = ml[mi];
      permOff(buf, base, buf, tmp, perms[m]);
      nodes++;
      if (isSolved(pz, buf, tmp)) { path[g] = m; foundLen = g + 1; return true; }
      permOff(buf, tmp, buf, nxt, qp);
      if (isSolved(pz, buf, nxt)) { path[g] = m; foundLen = g + 1; return true; }
      if (g + 1 >= limit) continue;
      hashOff(buf, nxt);
      const kk = (k + 1) % P, a = HA ^ Math.imul(kk + 1, 0x9e3779b1), b = HB, slot = (a ^ (b >>> 7)) & TT_MASK;
      const rem = limit - g - 1;
      if (TTG[slot] === ttGen && TTA[slot] === a && TTB[slot] === b && TTD[slot] >= rem) continue;
      TTG[slot] = ttGen; TTA[slot] = a; TTB[slot] = b; TTD[slot] = rem;
      if (nodes > nodeCap) return false;
      if (dfs(g + 1, k + 1)) { path[g] = m; return true; }
    }
    return false;
  }
  for (limit = 1; limit <= maxDepth; limit++) {
    ttGen++;
    if (dfs(0, k0)) return { path: path.slice(0, foundLen), nodes };
    if (nodes > nodeCap) break;
  }
  return null;
}

function popcount(x) { x -= (x >>> 1) & 0x55555555; x = (x & 0x33333333) + ((x >>> 2) & 0x33333333); return (((x + (x >>> 4)) & 0xf0f0f0f) * 0x1010101) >>> 24; }
function minDist(mask, cell) {
  const r0 = (cell / N) | 0, c0 = cell % N;
  let best = 99;
  for (let i = 0; i < NN; i++) if ((mask >> i) & 1) { const d = Math.abs(((i / N) | 0) - r0) + Math.abs((i % N) - c0); if (d < best) best = d; }
  return best;
}
// Greedy evaluation used by strategy B.
function scoreBoard(pz, vals) {
  const rr = flood(vals, 0, RIV, pz.spring), rd = flood(vals, 0, ROD, pz.han);
  let s = (popcount(rr) + popcount(rd)) * 12;
  for (const v of pz.villages) {
    let ok = true;
    if (v.need & NEED_RIVER && !((rr >> v.cell) & 1)) { ok = false; s -= 60 * minDist(rr, v.cell); }
    if (v.need & NEED_ROAD && !((rd >> v.cell) & 1)) { ok = false; s -= 60 * minDist(rd, v.cell); }
    if (ok) s += 1000;
  }
  for (let i = 0; i < NN; i++) {
    const a = RIV[vals[i]], b = ROD[vals[i]];
    const jr = NB[i * 4 + 1], js = NB[i * 4 + 2];
    if (jr >= 0) { if (a & 2 && RIV[vals[jr]] & 8) s += 3; if (b & 2 && ROD[vals[jr]] & 8) s += 3; }
    if (js >= 0) { if (a & 4 && RIV[vals[js]] & 1) s += 3; if (b & 4 && ROD[vals[js]] & 1) s += 3; }
  }
  return s;
}
// Strategy B: narrow beam search on the greedy score. Not optimal; plays more "by feel".
function solveBeam(pz, vals0, k0, seed = 7) {
  for (const w of [24, 120, 600]) { const r = beamPass(pz, vals0, k0, w, 30, seed); if (r) return r; }
  return null;
}
function beamPass(pz, vals0, k0, width, maxDepth, seed) {
  const P = pz.quakes.length, rnd = rng32(seed);
  if (isSolved(pz, vals0, 0)) return { path: [] };
  let beam = [{ v: vals0, k: k0, path: [] }];
  const seen = new Set();
  for (let d = 0; d < maxDepth; d++) {
    const cand = [];
    for (const node of beam) {
      const qp = pz.perms[pz.quakes[node.k % P]];
      for (const m of pz.moveList) {
        const t = applyPerm(node.v, pz.perms[m]);
        if (isSolved(pz, t, 0)) return { path: node.path.concat(m) };
        const q = applyPerm(t, qp);
        if (isSolved(pz, q, 0)) return { path: node.path.concat(m) };
        hashOff(q, 0);
        const key = HA + ':' + HB + ':' + ((node.k + 1) % P);
        if (seen.has(key)) continue;
        seen.add(key);
        cand.push({ v: q, k: node.k + 1, path: node.path.concat(m), s: scoreBoard(pz, q) + rnd() * 4 });
      }
    }
    if (!cand.length) return null;
    cand.sort((x, y) => y.s - x.s);
    beam = cand.slice(0, width);
  }
  return null;
}

// ---- generator: build a solved board, then scramble it with reverse moves and reverse quakes ----
function layoutSolved(R, cfg) {
  const fixed = new Uint8Array(NN), vals = new Uint8Array(NN);
  const rowF = [0, 0, 0, 0, 0], colF = [0, 0, 0, 0, 0];
  const canPlace = (i) => {
    if (fixed[i]) return false;
    const r = (i / N) | 0, c = i % N;
    if (rowF[r] >= 2 || colF[c] >= 2) return false;
    for (let e = 0; e < 4; e++) { const j = NB[i * 4 + e]; if (j >= 0 && fixed[j]) return false; }
    return true;
  };
  const place = (v) => {
    for (let t = 0; t < 60; t++) {
      const i = (R() * NN) | 0;
      if (!canPlace(i)) continue;
      fixed[i] = 1; vals[i] = v; rowF[(i / N) | 0]++; colF[i % N]++;
      return i;
    }
    return -1;
  };
  const needs = cfg.nv === 2 ? [NEED_RIVER, NEED_ROAD] : [NEED_RIVER, NEED_ROAD, R() < 0.5 ? 3 : R() < 0.5 ? 1 : 2];
  const spring = place(tv(KS, 0)), han = place(tv(KH, 0));
  if (spring < 0 || han < 0) return null;
  const villages = [];
  for (const need of needs) {
    const c = place(tv(KV, need));
    if (c < 0) return null;
    villages.push({ cell: c, need });
  }
  // villages must not be trivially close to their source
  const md = (a, b) => Math.abs(((a / N) | 0) - ((b / N) | 0)) + Math.abs((a % N) - (b % N));
  for (const v of villages) {
    if (v.need & NEED_RIVER && md(v.cell, spring) < 3) return null;
    if (v.need & NEED_ROAD && md(v.cell, han) < 3) return null;
  }
  for (let k = 0; k < cfg.nm; k++) if (place(tv(KM, 0)) < 0) return null;

  // route each need from its village to the growing network of that type
  const type = new Uint8Array(NN), mask = new Uint8Array(NN);
  const net = [0, 1 << spring, 1 << han];
  const order = [];
  for (const v of villages) { if (v.need & NEED_RIVER) order.push([v, 1]); if (v.need & NEED_ROAD) order.push([v, 2]); }
  for (let i = order.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }
  for (const [v, T] of order) {
    const cost = new Float32Array(NN);
    for (let i = 0; i < NN; i++) cost[i] = 1 + R() * 1.6;
    const dist = new Float32Array(NN).fill(1e9), prev = new Int8Array(NN).fill(-1), done = new Uint8Array(NN);
    dist[v.cell] = 0;
    let hit = -1;
    for (;;) {
      let u = -1, bd = 1e9;
      for (let i = 0; i < NN; i++) if (!done[i] && dist[i] < bd) { bd = dist[i]; u = i; }
      if (u < 0) break;
      done[u] = 1;
      if (u !== v.cell && (net[T] >> u) & 1) { hit = u; break; }
      if (u !== v.cell && fixed[u]) continue; // fixed cells are only endpoints
      for (let e = 0; e < 4; e++) {
        const j = NB[u * 4 + e];
        if (j < 0 || done[j]) continue;
        const isTarget = (net[T] >> j) & 1;
        if (!isTarget && (fixed[j] || (type[j] && type[j] !== T))) continue;
        if (isTarget && fixed[j] && u === v.cell) continue; // need at least one path tile
        const nd = dist[u] + cost[j];
        if (nd < dist[j]) { dist[j] = nd; prev[j] = u; }
      }
    }
    if (hit < 0) return null;
    const cells = [];
    for (let x = hit; x >= 0; x = prev[x]) cells.push(x);
    for (let a = 0; a + 1 < cells.length; a++) {
      const p = cells[a], q = cells[a + 1];
      let e = 0;
      while (NB[p * 4 + e] !== q) e++;
      if (!fixed[p]) { mask[p] |= 1 << e; type[p] = T; }
      if (!fixed[q]) { mask[q] |= 1 << OPP[e]; type[q] = T; }
    }
    for (const c of cells) net[T] |= 1 << c;
  }
  let pathTiles = 0;
  for (let i = 0; i < NN; i++) {
    if (fixed[i]) continue;
    if (type[i]) { vals[i] = tv(type[i] === 1 ? KR : KD, mask[i]); pathTiles++; continue; }
    if (R() < cfg.decoy) {
      const shapes = [5, 10, 5, 10, 3, 6, 12, 9];
      vals[i] = tv(R() < 0.5 ? KR : KD, shapes[(R() * shapes.length) | 0]);
    } else vals[i] = tv(KE, 0);
  }
  if (pathTiles < cfg.minPath) return null;
  // tile-ferry card: place movable Ferry tile pair along the river network
  if (cfg.ferry) {
    const rCells = [];
    for (let i = 0; i < NN; i++) if (!fixed[i] && type[i] === 1) rCells.push(i);
    if (rCells.length >= 2) {
      const f1 = rCells[0], f2 = rCells[rCells.length - 1];
      vals[f1] = tv(KF, mask[f1] || 15);
      vals[f2] = tv(KF, mask[f2] || 15);
    }
  }
  return { fixed, vals, spring, han, villages };
}

function makePuzzle(seed, cfg) {
  const R = rng32(seed);
  for (let att = 0; att < 400; att++) {
    const L = layoutSolved(R, cfg);
    if (!L) continue;
    const { perms, lens } = buildPerms(L.fixed);
    const moveList = [];
    for (let line = 0; line < 2 * N; line++) { if (lens[line] >= 2) moveList.push(line * 2); if (lens[line] >= 3) moveList.push(line * 2 + 1); }
    const qRows = [];
    for (let r = 0; r < N; r++) if (lens[r] >= 3) qRows.push(r);
    if (qRows.length < 2) continue;
    const quakes = [];
    for (let k = 0; k < cfg.P; k++) {
      let r;
      do r = qRows[(R() * qRows.length) | 0]; while (k > 0 && r === moveLine(quakes[k - 1]) && qRows.length > 1);
      quakes.push(r * 2 + (R() < 0.5 ? 0 : 1));
    }
    const pz = {
      seed, cfg, tiles: L.vals, fixed: L.fixed, spring: L.spring, han: L.han, villages: L.villages,
      needRiver: L.villages.some((v) => v.need & NEED_RIVER), needRoad: L.villages.some((v) => v.need & NEED_ROAD),
      perms, lens, moveList, quakes, K: cfg.K,
    };
    let best = null;
    for (let s = 0; s < 8; s++) {
      // reverse play: last player move (no quake after it), then for each earlier move: undo its quake, undo the move
      let ids = new Uint8Array(NN);
      for (let i = 0; i < NN; i++) ids[i] = i;
      for (let j = cfg.K - 1; j >= 0; j--) {
        if (j < cfg.K - 1) ids = applyPerm(ids, perms[quakes[j % cfg.P] ^ 1]);
        for (let t = 0; t < 20; t++) {
          const m = moveList[(R() * moveList.length) | 0];
          const nx = applyPerm(ids, perms[m ^ 1]);
          const a = toVals(pz, ids), b = toVals(pz, nx);
          let diff = false;
          for (let i = 0; i < NN; i++) if (a[i] !== b[i]) { diff = true; break; }
          if (diff) { ids = nx; break; }
        }
      }
      const v0 = toVals(pz, ids);
      if (isSolved(pz, v0, 0)) continue;
      const sol = solveOptimal(pz, v0, 0, cfg.K, 8e5);
      if (!sol || !sol.path.length) continue;
      if (!best || sol.path.length > best.sol.path.length) best = { ids, sol };
      if (sol.path.length >= cfg.minPar) break;
    }
    if (!best) continue;
    pz.start = best.ids;
    pz.par = best.sol.path.length;
    pz.solution = best.sol.path;
    pz.solveNodes = best.sol.nodes;
    pz.attempts = att + 1;
    return pz;
  }
  return null;
}

// ---------------------------------------------------------------- water ripple particles (cosmetic card: juice-ripples)
// Concentric ripple rings, radial shimmer glow & splash droplets when water connects to a village.
function spawnWaterRipple(cell) {
  const rings = RM ? [{ rMax: cs * 0.42, dur: 0.4, delay: 0 }] : [
    { rMax: cs * 0.76, dur: 0.68, delay: 0 },
    { rMax: cs * 0.60, dur: 0.60, delay: 0.12 },
    { rMax: cs * 0.44, dur: 0.52, delay: 0.24 },
  ];
  const drops = [];
  if (!RM) {
    const cols = highContrast
      ? ['#00e5ff', '#ffffff', '#0077b6', '#ffffff']
      : currentTheme === 'gece'
      ? ['#64b5f6', '#30bde2', '#e5eef8', '#90caf9', '#ffffff']
      : currentTheme === 'kagit'
      ? ['#268ec7', '#46bfe0', '#ffffff', '#fdfaf2', '#18649c']
      : G.biome === 'karadeniz'
      ? ['#2ea8b8', '#92ebd9', '#ffffff', '#196b75', '#e6f7f5']
      : G.biome === 'ege'
      ? ['#2bb1c9', '#99edf2', '#ffffff', '#1c7295', '#eefbfb']
      : ['#9fe3ea', '#3d95cf', '#7cc4f0', '#ffffff', '#2fa3b6', '#e2f7ff'];
    const count = 10;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
      const sp = cs * (0.8 + Math.random() * 1.3);
      drops.push({
        dx: 0, dy: 0,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.8 - cs * 0.65,
        r: cs * (0.024 + Math.random() * 0.018),
        life: 0.52 + Math.random() * 0.22,
        t: 0,
        col: cols[i % cols.length],
      });
    }
  }
  ripples.push({ cell, rings, drops, t: 0, dur: 0.88 });
}
function drawRipples(dt) {
  if (!ripples.length) return;
  const s = dt / 1000;
  ripples = ripples.filter((rp) => rp.t < rp.dur);
  for (const rp of ripples) {
    rp.t += s;
    const cx = ox + (rp.cell % N) * cs + cs / 2;
    const cy = oy + ((rp.cell / N) | 0) * cs + cs / 2;
    // Radial water shimmer glow at the village
    const glowProgress = Math.min(1, rp.t / 0.45);
    const glowAlpha = Math.max(0, (1 - glowProgress) * (RM ? 0.25 : 0.42));
    if (glowAlpha > 0) {
      const gl = ctx.createRadialGradient(cx, cy, 2, cx, cy, cs * 0.62);
      if (highContrast) {
        gl.addColorStop(0, `rgba(0,229,255,${glowAlpha * 0.8})`);
        gl.addColorStop(0.5, `rgba(0,119,182,${glowAlpha * 0.4})`);
        gl.addColorStop(1, 'rgba(0,119,182,0)');
      } else if (currentTheme === 'gece') {
        gl.addColorStop(0, `rgba(100,181,246,${glowAlpha})`);
        gl.addColorStop(0.5, `rgba(42,106,176,${glowAlpha * 0.35})`);
        gl.addColorStop(1, 'rgba(42,106,176,0)');
      } else {
        gl.addColorStop(0, `rgba(159,227,234,${glowAlpha})`);
        gl.addColorStop(0.5, `rgba(61,149,207,${glowAlpha * 0.35})`);
        gl.addColorStop(1, 'rgba(61,149,207,0)');
      }
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, cs * 0.62, 0, 7); ctx.fill();
    }
    // Concentric expanding ripple rings
    for (const rg of rp.rings) {
      if (rp.t < rg.delay) continue;
      const u = Math.min(1, (rp.t - rg.delay) / rg.dur);
      if (u >= 1) continue;
      const ease = 1 - Math.pow(1 - u, 2.4);
      const r = rg.rMax * ease;
      const alpha = (1 - u) * 0.85;
      ctx.save();
      // Outer river blue ripple line
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7);
      ctx.lineWidth = Math.max(1.2, cs * 0.036 * (1 - u * 0.6));
      if (highContrast) {
        ctx.strokeStyle = `rgba(0,229,255,${alpha * 0.95})`;
      } else if (currentTheme === 'gece') {
        ctx.strokeStyle = `rgba(100,181,246,${alpha * 0.88})`;
      } else {
        ctx.strokeStyle = `rgba(61,149,207,${alpha * 0.85})`;
      }
      ctx.stroke();
      // Inner crest highlight (bright water foam/sheen)
      ctx.beginPath(); ctx.arc(cx, cy, Math.max(0, r - 1.2), 0, 7);
      ctx.lineWidth = Math.max(0.8, cs * 0.02 * (1 - u));
      ctx.strokeStyle = highContrast ? `rgba(255,255,255,${alpha})` : `rgba(226,247,255,${alpha * 0.95})`;
      ctx.stroke();
      ctx.restore();
    }
    // Splash droplet particles (respects prefers-reduced-motion)
    for (const d of rp.drops) {
      d.t += s;
      if (d.t >= d.life) continue;
      const u = d.t / d.life;
      d.vy += cs * 4.5 * s;
      d.vx *= 0.96; d.vy *= 0.96;
      d.dx += d.vx * s; d.dy += d.vy * s;
      const alpha = Math.max(0, (1 - u) * 0.92);
      const curR = Math.max(0.5, d.r * (1 - u * 0.35));
      ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = d.col;
      ctx.beginPath(); ctx.arc(cx + d.dx, cy + d.dy, curR, 0, 7); ctx.fill(); ctx.restore();
    }
  }
}

// ---------------------------------------------------------------- floating dust / sand motes (cosmetic card: juice-dust)
// Ambient atmospheric motes drifting across the warm parchment map with wind sway & quake reaction.
const MOTE_COUNT = 22;

const MOTE_PALETTES = {
  classic: ['rgba(242,179,61,', 'rgba(238,220,176,', 'rgba(255,248,231,', 'rgba(194,154,96,'],

  contrast: ['rgba(255,255,255,', 'rgba(255,183,3,', 'rgba(0,229,255,', 'rgba(240,240,240,'],

function getMoteColors() {
  if (highContrast) return MOTE_PALETTES.contrast;

  if (currentTheme === 'kagit') return MOTE_PALETTES.kagit;

}
function initMotes() {
  motes = [];

  const cols = MOTE_PALETTES.classic;
  for (let i = 0; i < MOTE_COUNT; i++) {
    motes.push({
      u: R(),
      v: R(),
      speed: 0.012 + R() * 0.022,
      angle: 0.65 + (R() - 0.5) * 0.45,
      wobbleSpeed: 1.2 + R() * 2.2,
      wobbleAmp: 0.003 + R() * 0.005,
      phase: R() * Math.PI * 2,
      size: 0.75 + R() * 1.35,
      baseAlpha: 0.18 + R() * 0.32,

}
initMotes();

function drawMotes(dt, now) {
  if (RM || !motesEnabled || !G.pz || !baseC || !disp) return;
  const s = dt / 1000, S = baseC.S;
  if (!S || S <= 0) return;
  const x0 = ox - pad, y0 = oy - pad;
  // Agitation factor when quakes shake the steppe ground
  const turb = shake > 0 ? Math.min(3, shake / (cs * 0.03)) : 0;
  const cols = getMoteColors();
  ctx.save();
  for (let i = 0; i < motes.length; i++) {
    const m = motes[i];
    const sway = Math.sin(now * 0.0016 * m.wobbleSpeed + m.phase);
    const swayCos = Math.cos(now * 0.0014 * m.wobbleSpeed + m.phase);
    m.u += (Math.cos(m.angle) * m.speed + sway * m.wobbleAmp * (1 + turb * 1.5)) * s;
    m.v += (Math.sin(m.angle) * m.speed * (1 + turb * 0.6) + swayCos * m.wobbleAmp * (1 + turb * 2)) * s;
    if (m.u < 0) m.u += 1; else if (m.u > 1) m.u -= 1;
    if (m.v < 0) m.v += 1; else if (m.v > 1) m.v -= 1;
    const edgeFade = Math.min(1, m.u / 0.08, (1 - m.u) / 0.08, m.v / 0.08, (1 - m.v) / 0.08);
    if (edgeFade <= 0) continue;
    const twinkle = 0.82 + 0.18 * Math.sin(now * 0.0025 + m.phase);
    const a = m.baseAlpha * edgeFade * twinkle;
    const px = x0 + m.u * S, py = y0 + m.v * S;
    const prefix = cols[m.colorIdx % cols.length] || m.colorPrefix;
    ctx.fillStyle = prefix + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(px, py, m.size, 0, 6.283);
    ctx.fill();
    if (m.halo && a > 0.15) {
      ctx.fillStyle = prefix + (a * 0.35).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(px, py, m.size * 2.4, 0, 6.283);
      ctx.fill();
    }
  }
  ctx.restore();
}

// ---------------------------------------------------------------- input
function hitTest(px, py) {
  const bx = (px - ox) / cs, by = (py - oy) / cs;
  if (bx >= 0 && bx < N && by >= 0 && by < N) return { cell: (by | 0) * N + (bx | 0) };
  if (by >= 0 && by < N) { if (bx < 0 && bx >= -GUT) return { m: (by | 0) * 2 + 1 }; if (bx >= N && bx < N + GUT) return { m: (by | 0) * 2 }; }
  if (bx >= 0 && bx < N) { if (by < 0 && by >= -GUT) return { m: (N + (bx | 0)) * 2 + 1 }; if (by >= N && by < N + GUT) return { m: (N + (bx | 0)) * 2 }; }
  return null;
}
const ptr = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
let drag = null;
cv.addEventListener('pointerdown', (e) => {
  audio();
  if (G.bot || G.state !== 'play') return;
  const p = ptr(e), h = hitTest(p.x, p.y);
  if (!h) return;
  drag = { x: p.x, y: p.y, h, done: false };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', (e) => {
  const p = ptr(e);
  if (e.pointerType === 'mouse') { const h = hitTest(p.x, p.y); hover = h && h.cell != null ? h.cell : -1; }
  if (!drag || drag.done || drag.h.cell == null) return;
  const dx = p.x - drag.x, dy = p.y - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < cs * 0.25) return;
  const c = drag.h.cell;
  const m = Math.abs(dx) > Math.abs(dy) ? ((c / N) | 0) * 2 + (dx > 0 ? 0 : 1) : (N + (c % N)) * 2 + (dy > 0 ? 0 : 1);
  drag.done = true; doMove(m);
});
const endDrag = (e) => {
  if (drag && !drag.done && drag.h.m != null) { const p = ptr(e); if (Math.hypot(p.x - drag.x, p.y - drag.y) < cs * 0.4) doMove(drag.h.m); }
  drag = null;
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; });
cv.addEventListener('pointerleave', () => { hover = -1; });
addEventListener('keydown', (e) => {
  audio();
  if ($('help').classList.contains('on') && (e.key === 'Escape' || e.key === 'Enter')) { closeHelp(); e.preventDefault(); return; }
  if ($('verify').classList.contains('on') && (e.key === 'Escape' || e.key === 'Enter')) { closeVerify(); e.preventDefault(); return; }
  if (document.querySelector('.ov.on')) return;
  if (G.state !== 'play' || G.bot) return;
  const k = e.key.toLowerCase();
  if (cursor < 0 && /^(w|a|s|d|arrow)/.test(k)) cursor = 12;
  const r = (cursor / N) | 0, c = cursor % N;
  if (k === 'a' || k === 'd') { cursor = r * N + ((c + (k === 'd' ? 1 : -1) + N) % N); sfx.click('soft'); e.preventDefault(); return; }
  if (k === 'w' || k === 's') { cursor = ((r + (k === 's' ? 1 : -1) + N) % N) * N + c; sfx.click('soft'); e.preventDefault(); return; }
  const am = { arrowright: r * 2, arrowleft: r * 2 + 1, arrowdown: (N + c) * 2, arrowup: (N + c) * 2 + 1 }[k];
  if (am != null) { doMove(am); e.preventDefault(); return; }
  if (k === 'z' || k === 'backspace') { undo(); e.preventDefault(); }
  else if (k === 'r') restart();
  else if (k === 'm') toggleMute();
  else if (k === 'c') { toggleContrast(); sfx.click(); }

});

function renderSealSvg(verified = true) {
  const outer = highContrast ? '#8a200a' : '#a63f27';
  const innerBg = highContrast ? '#ffffff' : '#f4ebd4';
  const innerStroke = highContrast ? '#111111' : '#8d6e3f';
  const starFill = highContrast ? 'rgba(0,0,0,.08)' : 'rgba(166,63,39,.12)';
  const starStroke = highContrast ? '#8a200a' : '#a63f27';
  const coreFill = verified ? (highContrast ? '#0f5132' : '#325b39') : (highContrast ? '#333333' : '#8d6e3f');
  const coreStroke = highContrast ? '#ffb703' : '#f2b33d';
  return `<svg class="seal-svg" viewBox="0 0 80 80" aria-hidden="true">
    <circle cx="40" cy="40" r="38" fill="none" stroke="${outer}" stroke-width="2.5" stroke-dasharray="3 2"/>
    <circle cx="40" cy="40" r="33" fill="${innerBg}" stroke="${innerStroke}" stroke-width="1.8"/>
    <path d="M40 14 L44 26 L56 22 L49 32 L58 40 L49 48 L56 58 L44 54 L40 66 L36 54 L24 58 L31 48 L22 40 L31 32 L24 22 L36 26 Z" fill="${starFill}" stroke="${starStroke}" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="40" cy="40" r="19" fill="${coreFill}" stroke="${coreStroke}" stroke-width="2"/>
    ${verified ? '<path d="M30 40 L37 47 L50 33" fill="none" stroke="#f3ead8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>' : '<path d="M40 28 L40 44 M40 48 L40 52" stroke="#f3ead8" stroke-width="3" stroke-linecap="round"/>'}
  </svg>`;
}
function verifyDailySeed(seedStr) {
  const seed = /^\d+$/.test(seedStr) ? +seedStr : hashStr(seedStr);
  const cfg = dailyConfig(seedStr);
  let pz = null;
  for (let k = 0; !pz && k < 5; k++) pz = makePuzzle(seed + k * 7919, cfg);
  if (!pz || !pz.solution || !pz.solution.length) return { seed: seedStr, ok: false, error: 'no puzzle' };
  let ids = pz.start.slice(), solved = false;
  for (let k = 0; k < pz.solution.length; k++) {
    ids = applyPerm(ids, pz.perms[pz.solution[k]]);
    if (isSolved(pz, toVals(pz, ids), 0)) { solved = (k === pz.solution.length - 1); break; }
    ids = applyPerm(ids, pz.perms[pz.quakes[k % pz.quakes.length]]);
    if (isSolved(pz, toVals(pz, ids), 0)) { solved = (k === pz.solution.length - 1); break; }
  }
  return { seed: seedStr, ok: solved, par: pz.par, K: pz.K, attempts: pz.attempts, nodes: pz.solveNodes, moves: pz.solution.length };
}
function getDailySeedList(fromStr = '20261130', toStr = '20261231') {
  fromStr = String(fromStr || '20261130').replace(/-/g, '');
  toStr = String(toStr || '20261231').replace(/-/g, '');
  const list = [];
  const y1 = +fromStr.slice(0, 4), m1 = +fromStr.slice(4, 6) - 1, d1 = +fromStr.slice(6, 8);
  const cur = new Date(y1, m1, d1, 12, 0, 0);
  const end = new Date(+toStr.slice(0, 4), +toStr.slice(4, 6) - 1, +toStr.slice(6, 8), 12, 0, 0);
  while (cur <= end) {
    const s = String(cur.getFullYear() * 10000 + (cur.getMonth() + 1) * 100 + cur.getDate());
    list.push(s);
    cur.setDate(cur.getDate() + 1);
  }
  return list;
}
let lastIntegrityReport = null;
function runSeedVerification(fromStr = '20261130', toStr = '20261231') {
  const seeds = getDailySeedList(fromStr, toStr);
  const results = [];
  let solvable = 0, totalPar = 0, minPar = 999, maxPar = 0;
  for (const s of seeds) {
    const res = verifyDailySeed(s);
    results.push(res);
    if (res.ok) {
      solvable++;
      totalPar += res.par;
      if (res.par < minPar) minPar = res.par;
      if (res.par > maxPar) maxPar = res.par;
    }
  }
  const report = {
    range: { from: String(fromStr).replace(/-/g, ''), to: String(toStr).replace(/-/g, '') },
    total: seeds.length,
    solvable,
    ok: solvable === seeds.length,
    avgPar: solvable ? +(totalPar / solvable).toFixed(2) : 0,
    minPar: minPar === 999 ? 0 : minPar,
    maxPar,
    freezeDate: '2026-11-30',
    results,
  };
  lastIntegrityReport = report;
  return report;
}

let shareCardArtEnabled = true;
function setShareCardArt(v) {

  const w = $('rCardWrap'), b = $('bSaveCard');
  if (w) w.style.display = shareCardArtEnabled ? '' : 'none';

function drawCardStar(cx, x, y, r, on) {
  cx.save();
  cx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i === 0 ? cx.moveTo(px, py) : cx.lineTo(px, py);
  }
  cx.closePath();
  if (on) {
    cx.fillStyle = '#f2b33d';
    cx.fill();
    cx.lineWidth = 1.5;
    cx.strokeStyle = '#9c6a12';
    cx.stroke();
  } else {
    cx.fillStyle = 'rgba(141,127,105,.22)';
    cx.fill();
    cx.lineWidth = 1.2;
    cx.strokeStyle = '#8d7f69';
    cx.stroke();
  }
  cx.restore();
}

function renderShareCard(c = $('rCard')) {
  if (!c || !G.pz) return;
  const cx = c.getContext('2d');
  const CW = c.width, CH = c.height;
  const pz = G.pz, vals = (disp && disp.vals) ? disp.vals : toVals(pz, G.ids);

  // 1. Parchment base with subtle gradient & contours
  const bg = cx.createLinearGradient(0, 0, CW, CH);
  bg.addColorStop(0, '#f8eedc');
  bg.addColorStop(0.5, '#f1e1be');
  bg.addColorStop(1, '#dfc794');
  cx.fillStyle = bg;
  cx.fillRect(0, 0, CW, CH);

  // Topographic survey lines (Anatolian map motif)
  cx.save();
  cx.strokeStyle = 'rgba(150,108,58,.12)';
  cx.lineWidth = 1.2;
  const R = rng32(hashStr('sc' + G.seed));
  for (let k = 0; k < 6; k++) {
    cx.beginPath();
    const y0 = 36 + k * 65 + R() * 20;
    for (let px = 0; px <= CW; px += 10) {
      const y = y0 + Math.sin((px / CW) * 6 + k) * 14 + Math.cos((px / CW) * 11 + k) * 6;
      px ? cx.lineTo(px, y) : cx.moveTo(px, y);
    }
    cx.stroke();
  }
  // Subtle paper speckles
  for (let i = 0; i < 140; i++) {
    cx.fillStyle = R() < 0.5 ? 'rgba(120,84,40,.06)' : 'rgba(255,255,255,.12)';
    cx.fillRect(R() * CW, R() * CH, 1 + R() * 1.5, 1 + R() * 1.5);
  }
  // Double-ruled decorative border with corner accents
  const cardPad = 12, cr = 14;
  cx.lineWidth = 2.5;
  cx.strokeStyle = '#9f7742';
  rr(cx, cardPad, cardPad, CW - 2 * cardPad, CH - 2 * cardPad, cr);
  cx.stroke();
  cx.lineWidth = 1;
  cx.strokeStyle = 'rgba(120,85,45,.45)';
  rr(cx, cardPad + 4, cardPad + 4, CW - 2 * cardPad - 8, CH - 2 * cardPad - 8, cr - 3);
  cx.stroke();
  const corner = (x, y) => {
    cx.fillStyle = '#a63f27';
    cx.beginPath(); cx.moveTo(x, y - 4); cx.lineTo(x + 4, y); cx.lineTo(x, y + 4); cx.lineTo(x - 4, y); cx.closePath(); cx.fill();
  };
  corner(cardPad + 10, cardPad + 10);
  corner(CW - cardPad - 10, cardPad + 10);
  corner(cardPad + 10, CH - cardPad - 10);
  corner(CW - cardPad - 10, CH - cardPad - 10);
  cx.restore();

  // 2. Header: Brand, Mode, Location, Status badge
  cx.save();
  cx.font = '700 24px "Palatino Linotype",Palatino,Georgia,serif';
  cx.fillStyle = '#5a2a18';
  cx.textAlign = 'left';
  cx.textBaseline = 'middle';
  cx.fillText('FAY HATTI', cardPad + 18, cardPad + 22);

  const dateStr = G.mode === 'daily' ? seedLabel(G.seed) : t('level', { n: G.level });
  const locStr = G.place ? ` · ${G.place.toUpperCase()}` : '';
  const modeStr = G.mode === 'daily' ? (lang === 'tr' ? 'GÜNÜN BULMACASI' : 'DAILY PUZZLE') : (lang === 'tr' ? 'SONSUZ MOD' : 'ENDLESS');
  cx.font = '600 12px "Segoe UI",system-ui,sans-serif';
  cx.fillStyle = '#7a5638';
  cx.fillText(`${modeStr} · ${dateStr}${locStr}`, cardPad + 19, cardPad + 42);

  // Status pill badge
  const bW = 104, bH = 26, bX = CW - cardPad - 18 - bW, bY = cardPad + 16;
  cx.fillStyle = '#a63f27';
  rr(cx, bX, bY, bW, bH, 13);
  cx.fill();
  cx.fillStyle = '#fff8ec';
  cx.font = '700 12px "Segoe UI",system-ui,sans-serif';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillText(t('solvedT').toUpperCase(), bX + bW / 2, bY + bH / 2 + 1);

  // Fault line separator (seismic crack motif)
  cx.strokeStyle = '#e0553a';
  cx.lineWidth = 1.5;
  cx.beginPath();
  const sepY = cardPad + 56;
  cx.moveTo(cardPad + 16, sepY);
  cx.lineTo(CW * 0.35, sepY);
  cx.lineTo(CW * 0.38, sepY - 3);
  cx.lineTo(CW * 0.42, sepY + 4);
  cx.lineTo(CW * 0.46, sepY - 2);
  cx.lineTo(CW * 0.50, sepY + 3);
  cx.lineTo(CW * 0.53, sepY);
  cx.lineTo(CW - cardPad - 16, sepY);
  cx.stroke();
  cx.restore();

  // 3. Left Side: The 5x5 Solved Map
  const gridX = cardPad + 16, gridY = 82;
  const mcs = 52, gridW = N * mcs;

  cx.save();
  // Map shadow & plate
  cx.fillStyle = 'rgba(70,42,18,.2)';
  rr(cx, gridX + 2, gridY + 3, gridW, gridW, 10);
  cx.fill();
  cx.fillStyle = '#ecd8ab';
  rr(cx, gridX, gridY, gridW, gridW, 10);
  cx.fill();
  cx.strokeStyle = '#9f7742';
  cx.lineWidth = 1.5;
  rr(cx, gridX, gridY, gridW, gridW, 10);
  cx.stroke();

  for (let i = 0; i < NN; i++) {
    const r = (i / N) | 0, c = i % N;
    const px = gridX + c * mcs, py = gridY + r * mcs;
    const v = vals[i], k = v >> 4, m = v & 15;
    const isFixed = pz.fixed[i];

    // Plate background
    const ins = 2, pr = 5;
    cx.fillStyle = isFixed ? 'rgba(120,85,45,.18)' : 'rgba(245,230,195,.85)';
    rr(cx, px + ins, py + ins, mcs - 2 * ins, mcs - 2 * ins, pr);
    cx.fill();
    cx.strokeStyle = isFixed ? 'rgba(120,85,45,.35)' : 'rgba(165,130,85,.3)';
    cx.lineWidth = 1;
    rr(cx, px + ins, py + ins, mcs - 2 * ins, mcs - 2 * ins, pr);
    cx.stroke();

    if (k === KR) {
      cx.lineWidth = mcs * 0.32; cx.strokeStyle = '#2a6c99'; cx.lineCap = 'butt'; cx.lineJoin = 'round';
      tracePath(cx, m, mcs, px, py); cx.stroke();
      if (!isCorner(m) && popcount(m) >= 3) { cx.beginPath(); cx.arc(px + mcs / 2, py + mcs / 2, (mcs * 0.32) / 2, 0, 7); cx.fillStyle = '#2a6c99'; cx.fill(); }
      cx.lineWidth = mcs * 0.2; cx.strokeStyle = '#3d95cf';
      tracePath(cx, m, mcs, px, py); cx.stroke();
      if (!isCorner(m) && popcount(m) >= 3) { cx.beginPath(); cx.arc(px + mcs / 2, py + mcs / 2, (mcs * 0.2) / 2, 0, 7); cx.fillStyle = '#3d95cf'; cx.fill(); }
    } else if (k === KD) {
      cx.lineWidth = mcs * 0.28; cx.strokeStyle = '#c79a5e'; cx.lineCap = 'butt'; cx.lineJoin = 'round';
      tracePath(cx, m, mcs, px, py); cx.stroke();
      if (!isCorner(m) && popcount(m) >= 3) { cx.beginPath(); cx.arc(px + mcs / 2, py + mcs / 2, (mcs * 0.28) / 2, 0, 7); cx.fillStyle = '#c79a5e'; cx.fill(); }
      cx.save(); cx.setLineDash([mcs * 0.1, mcs * 0.1]); cx.lineWidth = mcs * 0.06; cx.strokeStyle = 'rgba(248,234,200,.95)';
      tracePath(cx, m, mcs, px, py); cx.stroke(); cx.restore();
    } else if (k === KF) {
      cx.lineWidth = mcs * 0.32; cx.strokeStyle = '#2a6c99'; cx.lineCap = 'butt'; cx.lineJoin = 'round';
      tracePath(cx, m, mcs, px, py); cx.stroke();
      cx.lineWidth = mcs * 0.2; cx.strokeStyle = '#3d95cf';
      tracePath(cx, m, mcs, px, py); cx.stroke();
      const fcx = px + mcs / 2, fcy = py + mcs / 2;
      cx.fillStyle = '#206894'; cx.beginPath(); cx.arc(fcx, fcy, mcs * 0.24, 0, 7); cx.fill();
      cx.fillStyle = '#f7f3e8'; cx.beginPath(); cx.ellipse(fcx, fcy, mcs * 0.14, mcs * 0.07, 0, 0, 7); cx.fill();
      cx.fillStyle = '#a63f27'; cx.fillRect(fcx - mcs * 0.1, fcy + mcs * 0.01, mcs * 0.2, mcs * 0.03);
      cx.fillStyle = '#1b2830'; cx.fillRect(fcx - mcs * 0.03, fcy - mcs * 0.05, mcs * 0.06, mcs * 0.045);
    } else if (k === KM) drawMountain(cx, px, py, mcs);
    else if (k === KS) drawSpring(cx, px, py, mcs);
    else if (k === KH) drawHan(cx, px, py, mcs);
    else if (k === KV) drawVillage(cx, px, py, mcs, i * 31 + 5);

    if (k === KV || k === KS || k === KH) {
      for (let e2 = 0; e2 < 4; e2++) {
        const j = NB[i * 4 + e2];
        if (j < 0) continue;
        const p = edgePt(e2, mcs);
        const inR = RIV[v] && (RIV[vals[j]] >> OPP[e2]) & 1;
        const inD = ROD[v] && (ROD[vals[j]] >> OPP[e2]) & 1;
        if (!inR && !inD) continue;
        const ix = px + mcs / 2 + DC[e2] * mcs * 0.3, iy = py + mcs / 2 + DR[e2] * mcs * 0.3;
        cx.lineCap = 'round'; cx.lineWidth = mcs * (inR ? 0.2 : 0.18); cx.strokeStyle = inR ? '#3d95cf' : '#c79a5e';
        cx.beginPath(); cx.moveTo(px + p[0], py + p[1]); cx.lineTo(ix, iy); cx.stroke();
      }
    }
  }

  // Village badges on map
  pz.villages.forEach((vg) => {
    const vx = gridX + (vg.cell % N) * mcs, vy = gridY + ((vg.cell / N) | 0) * mcs, vr = mcs * 0.13;
    if (vg.need & NEED_RIVER) {
      cx.fillStyle = '#2f86c4'; cx.beginPath(); cx.arc(vx + mcs * 0.2, vy + mcs * 0.2, vr, 0, 7); cx.fill();
      cx.strokeStyle = '#fff6e2'; cx.lineWidth = 1; cx.stroke();
      cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(vx + mcs * 0.2, vy + mcs * 0.2, vr * 0.5, 0, 7); cx.fill();
    }
    if (vg.need & NEED_ROAD) {
      cx.fillStyle = '#b9843f'; cx.beginPath(); cx.arc(vx + mcs * 0.8, vy + mcs * 0.2, vr, 0, 7); cx.fill();
      cx.strokeStyle = '#fff6e2'; cx.lineWidth = 1; cx.stroke();
      cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(vx + mcs * 0.8, vy + mcs * 0.2, vr * 0.5, 0, 7); cx.fill();
    }
  });
  cx.restore();

  // 4. Right Side: Performance, Stars, Moves/Par Bento Tiles
  const rightX = gridX + gridW + 16;
  const rightW = CW - cardPad - 16 - rightX;
  const rightY = 82;

  cx.save();
  // Stars tile
  const starBoxH = 72;
  cx.fillStyle = '#eadebe';
  rr(cx, rightX, rightY, rightW, starBoxH, 10);
  cx.fill();
  cx.strokeStyle = '#c9b588';
  cx.lineWidth = 1;
  rr(cx, rightX, rightY, rightW, starBoxH, 10);
  cx.stroke();

  const starSz = 30, starGap = (rightW - 3 * starSz) / 4;

  cx.font = '700 12px "Segoe UI",system-ui,sans-serif';
  cx.fillStyle = '#5a2a18';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  const starRatingText = G.stars === 3 ? (lang === 'tr' ? 'KUSURSUZ ÇÖZÜM' : 'PERFECT SOLVE') : G.stars === 2 ? (lang === 'tr' ? 'USTA İŞİ' : 'EXPERT') : (lang === 'tr' ? 'TAMAMLANDI' : 'SOLVED');
  cx.fillText(starRatingText, rightX + rightW / 2, rightY + starBoxH - 15);

  // Moves & Par boxes
  const statsY = rightY + starBoxH + 10;
  const statBoxW = (rightW - 8) / 2, statBoxH = 80;

  // Moves box
  cx.fillStyle = '#eadebe';
  rr(cx, rightX, statsY, statBoxW, statBoxH, 10);
  cx.fill();
  cx.strokeStyle = '#c9b588';
  cx.lineWidth = 1;
  rr(cx, rightX, statsY, statBoxW, statBoxH, 10);
  cx.stroke();

  cx.font = '600 11px "Segoe UI",system-ui,sans-serif';
  cx.fillStyle = '#7a5638';
  cx.fillText(t('moves').toUpperCase(), rightX + statBoxW / 2, statsY + 20);
  cx.font = '700 32px "Palatino Linotype",Palatino,serif';
  cx.fillStyle = '#5a2a18';
  cx.fillText(String(G.moves), rightX + statBoxW / 2, statsY + 52);

  // Par box
  const parX = rightX + statBoxW + 8;
  cx.fillStyle = '#eadebe';
  rr(cx, parX, statsY, statBoxW, statBoxH, 10);
  cx.fill();
  cx.strokeStyle = '#c9b588';
  cx.lineWidth = 1;
  rr(cx, parX, statsY, statBoxW, statBoxH, 10);
  cx.stroke();

  cx.font = '600 11px "Segoe UI",system-ui,sans-serif';
  cx.fillStyle = '#7a5638';
  cx.fillText(t('par').toUpperCase(), parX + statBoxW / 2, statsY + 20);
  cx.font = '700 32px "Palatino Linotype",Palatino,serif';
  cx.fillStyle = '#5a2a18';
  cx.fillText(String(pz.par), parX + statBoxW / 2, statsY + 52);

  // Seismic & Map Summary Tile
  const infoY = statsY + statBoxH + 10, infoH = 80;
  cx.fillStyle = '#eadebe';
  rr(cx, rightX, infoY, rightW, infoH, 10);
  cx.fill();
  cx.strokeStyle = '#c9b588';
  cx.lineWidth = 1;

async function share() {
  sfx.click();
  vibe(20);
  trackEvent('share', { mode: G.mode, seed: G.seed, level: G.level, moves: G.moves, stars: G.stars });
  const text = shareText() + '\n' + shareUrl();
  const c = $('rCard');
  if (shareCardArtEnabled && navigator.share && c && c.toBlob) {
    try {
      const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
      if (blob) {
        const file = new File([blob], `fay-hatti-${G.seed}.png`, { type: 'image/png' });

          return;
        }
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }
  if (shareCardArtEnabled && navigator.clipboard && window.ClipboardItem && c && c.toBlob) {
    try {
      const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
      if (blob) {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        toast(t('cardCopied'));
        return;
      }
    } catch (e) {}
  }
  if (navigator.share && matchMedia('(pointer:coarse)').matches) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(text);
    toast(t('copied'));
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast(t('copied')); } catch (e2) {}
    ta.remove();
  }
}
