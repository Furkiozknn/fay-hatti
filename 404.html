<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b2830">
<title>Sayfa bulunamadı — Fay Hattı</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b2830'/%3E%3Crect x='10' y='10' width='44' height='44' rx='8' fill='%23f3e7cc'/%3E%3Cpath d='M10 28h16l4 6h14l4-6h6' fill='none' stroke='%23a63f27' stroke-width='5' stroke-linejoin='round'/%3E%3Ccircle cx='20' cy='44' r='4' fill='%232b7fb8'/%3E%3C/svg%3E">
<style>
:root{--bg:#1b2830;--ink:#f3ead8;--terra:#a63f27;--paper:#f3e7cc;--paper-ink:#2b2118;--focus:#7cc4f0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(120% 80% at 50% 0%,#2a3f49 0%,var(--bg) 60%)}
main{max-width:420px;width:100%;background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:28px 24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 2px #d9c596}
h1{margin:0 0 6px;font-size:28px}
p{margin:8px 0 18px}
.fault{display:block;margin:0 auto 14px}
a.btn{display:block;min-height:48px;line-height:48px;margin:8px 0;border-radius:12px;background:var(--terra);color:#fff8ec;font-weight:700;text-decoration:none}
a.btn.alt{background:#e8dcc0;color:var(--paper-ink);box-shadow:inset 0 0 0 1px #b9a778}
a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<main>
  <svg class="fault" width="96" height="48" viewBox="0 0 96 48" aria-hidden="true"><path d="M2 20h30l8 12h16l8-12h30" fill="none" stroke="#a63f27" stroke-width="6" stroke-linejoin="round"/></svg>
  <h1>Fay hattı burada kopmuş</h1>
  <p>Aradığın sayfa bulunamadı. Adres değişmiş ya da yanlış yazılmış olabilir.</p>
  <a class="btn" href="https://furkiozknn.github.io/fay-hatti/">Oyuna dön</a>
  <a class="btn alt" href="https://furkiozknn.github.io/">Tüm oyunlar</a>
</main>
</body>
</html>
